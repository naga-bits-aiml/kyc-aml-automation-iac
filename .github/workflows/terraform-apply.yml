name: Terraform Apply (GCP Base VM)

on:
  workflow_dispatch:   # manual trigger
  push:
    branches: [ main ] # optional

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Import (graceful)
        working-directory: ./terraform
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          ZONE="us-central1-a"
          
          # Import resources - failures are ignored (already in state or don't exist)
          terraform import google_compute_firewall.allow_ssh kyc-allow-ssh 2>/dev/null || true
          terraform import google_compute_firewall.allow_web kyc-allow-web 2>/dev/null || true
          terraform import google_compute_instance.kyc_onboarding_vm projects/$PROJECT_ID/zones/$ZONE/instances/kyc-onboarding-vm 2>/dev/null || true
          terraform import google_compute_instance.kyc_web_agent_vm projects/$PROJECT_ID/zones/$ZONE/instances/kyc-web-agent-vm 2>/dev/null || true
          terraform import google_compute_instance_group.kyc_instance_group projects/$PROJECT_ID/zones/$ZONE/instanceGroups/kyc-instance-group 2>/dev/null || true
          
          echo "Import step complete (failures ignored)"
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -input=false
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT }}
